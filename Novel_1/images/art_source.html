<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#000}
  #stage{position:relative;width:1600px;height:2560px;overflow:hidden}
  canvas{position:absolute;inset:0}
  .title{position:absolute;right:250px;top:300px;writing-mode:vertical-rl;
    font-family:"Noto Serif CJK JP",serif;font-weight:600;font-size:156px;letter-spacing:.2em;
    color:#EEF1F8;text-shadow:0 0 18px rgba(170,190,255,.35),0 0 2px rgba(255,255,255,.6)}
  .team{position:absolute;left:230px;bottom:230px;writing-mode:vertical-rl;
    font-family:"Noto Serif CJK JP",serif;font-weight:500;font-size:40px;letter-spacing:.32em;color:rgba(226,232,246,.82)}
  .rule{position:absolute;right:190px;top:318px;width:2px;height:520px;background:linear-gradient(rgba(220,228,250,.0),rgba(220,228,250,.55),rgba(220,228,250,0))}
</style></head>
<body>
<div id="stage"><canvas id="c" width="1600" height="2560"></canvas></div>
<script>
const MODE = location.hash.slice(1) || "cover";
const W = 1600, H = 2560;
const cv = document.getElementById("c"), g = cv.getContext("2d");

// 決定的な乱数（毎回同じ絵になる）
let seed = MODE === "cover" ? 20260925 : 1790338;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

// ---- 群青の夜空
function sky(){
  const lg = g.createLinearGradient(0, 0, 0, H);
  lg.addColorStop(0, "#070C26"); lg.addColorStop(.45, "#15276A"); lg.addColorStop(.75, "#1B2F78"); lg.addColorStop(1, "#0A1238");
  g.fillStyle = lg; g.fillRect(0, 0, W, H);
  const rg = g.createRadialGradient(W * .62, H * .52, 50, W * .62, H * .52, H * .7);
  rg.addColorStop(0, "rgba(76,108,179,.35)"); rg.addColorStop(1, "rgba(76,108,179,0)");
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
}

// ---- 銀の川（天の川）：下から上へのぼる帯
function riverPath(t){ // t:0(下)→1(上)
  if (MODE === "cover") return { x: 180 + 1250 * t + 160 * Math.sin(t * 3.1), y: H + 60 - (H + 160) * t };
  return { x: 1520 - 1000 * Math.pow(t, .9) + 90 * Math.sin(t * 4), y: H + 40 - (H - 600) * t };
}
function river(){
  g.save(); g.globalCompositeOperation = "lighter";
  for (const [wid, a, blur] of [[520, .05, 90], [300, .07, 60], [140, .08, 30]]) {
    g.filter = `blur(${blur}px)`; g.strokeStyle = `rgba(190,205,255,${a})`; g.lineWidth = wid; g.lineCap = "round";
    g.beginPath(); for (let i = 0; i <= 60; i++) { const p = riverPath(i / 60); i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y); } g.stroke();
  }
  g.filter = "none";
  for (let i = 0; i < 9000; i++) {
    const t = rnd(); const p = riverPath(t); const d = gauss() * 120;
    const ang = Math.atan2(riverPath(Math.min(1, t + .01)).y - p.y, riverPath(Math.min(1, t + .01)).x - p.x) + Math.PI / 2;
    const x = p.x + Math.cos(ang) * d, y = p.y + Math.sin(ang) * d;
    const r = Math.abs(gauss()) * .7 + .3; const a = .25 + rnd() * .55;
    g.fillStyle = `rgba(${220 + rnd() * 35},${225 + rnd() * 30},255,${a})`;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  // 暗い塵の筋
  g.globalCompositeOperation = "source-over"; g.filter = "blur(26px)";
  g.strokeStyle = "rgba(8,12,40,.35)"; g.lineWidth = 46;
  g.beginPath(); for (let i = 0; i <= 40; i++) { const p = riverPath(i / 40); const o = 40 * Math.sin(i / 5); i ? g.lineTo(p.x + o, p.y) : g.moveTo(p.x + o, p.y); } g.stroke();
  g.filter = "none"; g.restore();
}

// ---- 星
function stars(n){
  for (let i = 0; i < n; i++) {
    const x = rnd() * W, y = rnd() * H, r = Math.pow(rnd(), 3) * 1.9 + .35, a = .35 + rnd() * .6;
    const tint = rnd(); const col = tint < .15 ? "255,226,190" : tint < .3 ? "190,210,255" : "240,244,255";
    g.fillStyle = `rgba(${col},${a})`; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  for (let i = 0; i < 12; i++) {
    const x = rnd() * W, y = rnd() * H, s = 5 + rnd() * 13;
    const rg = g.createRadialGradient(x, y, 0, x, y, s * 1.4);
    rg.addColorStop(0, "rgba(255,255,255,.95)"); rg.addColorStop(.12, "rgba(220,230,255,.55)"); rg.addColorStop(1, "rgba(200,215,255,0)");
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, s * 1.4, 0, 7); g.fill();
    g.strokeStyle = "rgba(230,238,255,.22)"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x - s * 1.2, y); g.lineTo(x + s * 1.2, y); g.moveTo(x, y - s * 1.2); g.lineTo(x, y + s * 1.2); g.stroke();
  }
}

// ---- 地球（遠くの青い星）
function earth(cx, cy, R){
  g.save();
  const halo = g.createRadialGradient(cx, cy, R * .9, cx, cy, R * 1.9);
  halo.addColorStop(0, "rgba(120,180,255,.45)"); halo.addColorStop(1, "rgba(120,180,255,0)");
  g.fillStyle = halo; g.beginPath(); g.arc(cx, cy, R * 1.9, 0, 7); g.fill();
  g.beginPath(); g.arc(cx, cy, R, 0, 7); g.clip();
  const ocean = g.createRadialGradient(cx + R * .35, cy - R * .3, R * .1, cx, cy, R);
  ocean.addColorStop(0, "#5FA8F0"); ocean.addColorStop(.55, "#1F5FB8"); ocean.addColorStop(1, "#0B2A66");
  g.fillStyle = ocean; g.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  // 陸（小さな塊を重ねた大陸）
  g.filter = "blur(2px)";
  for (const [ux, uy, spread, n] of [[-.25, -.15, .42, 26], [.3, .35, .3, 16], [.15, -.55, .18, 8]]) {
    const x0 = cx + ux * R, y0 = cy + uy * R;
    for (let m = 0; m < n; m++) {
      const x = x0 + gauss() * R * spread * .45, y = y0 + gauss() * R * spread * .3, r = R * (.05 + rnd() * .09);
      g.fillStyle = rnd() < .6 ? "rgba(112,124,76,.85)" : "rgba(150,128,86,.8)";
      g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
  }
  // 雲
  g.filter = "blur(2.5px)";
  for (let k = 0; k < 3; k++) {
    const sx = cx + (rnd() - .5) * R * 1.2, sy = cy + (rnd() - .5) * R * 1.2, turn = rnd() < .5 ? 1 : -1;
    for (let m = 0; m < 22; m++) {
      const t = m / 22 * 5, rr = 3 + t * R * .045;
      g.fillStyle = `rgba(255,255,255,${.25 + rnd() * .25})`;
      g.beginPath(); g.ellipse(sx + Math.cos(t * turn) * rr, sy + Math.sin(t * turn) * rr * .75, 4 + rnd() * 5, 2 + rnd() * 3, t, 0, 7); g.fill();
    }
  }
  for (let m = 0; m < 70; m++) {
    const a = rnd() * 6.28, d = Math.sqrt(rnd()) * R, x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d;
    g.fillStyle = `rgba(255,255,255,${.12 + rnd() * .22})`;
    g.beginPath(); g.ellipse(x, y, 6 + rnd() * 16, 2 + rnd() * 5, rnd() * .6 - .3, 0, 7); g.fill();
  }
  g.filter = "none";
  // 夜側の影（右上から光）
  const sh = g.createLinearGradient(cx + R * .75, cy - R * .75, cx - R * .75, cy + R * .75);
  sh.addColorStop(0, "rgba(3,6,24,0)"); sh.addColorStop(.42, "rgba(3,6,24,.08)"); sh.addColorStop(.62, "rgba(3,6,24,.72)"); sh.addColorStop(1, "rgba(3,6,24,.95)");
  g.fillStyle = sh; g.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  g.restore();
  // 大気の縁
  g.strokeStyle = "rgba(170,215,255,.55)"; g.lineWidth = 5; g.filter = "blur(2px)";
  g.beginPath(); g.arc(cx, cy, R + 1, -Math.PI * .95, Math.PI * .15); g.stroke(); g.filter = "none";
}

// ---- 小さな宇宙船（幹と梢の船）
function ship(cx, cy, ang, L){
  // 推進の尾（銀の川に沿って後ろへ）
  g.save(); g.globalCompositeOperation = "lighter";
  for (let i = 0; i < 3; i++) {
    g.filter = `blur(${10 + i * 14}px)`;
    const tail = g.createLinearGradient(cx, cy, cx - Math.cos(ang) * L * 4, cy - Math.sin(ang) * L * 4);
    tail.addColorStop(0, `rgba(255,214,150,${.5 - i * .12})`); tail.addColorStop(1, "rgba(255,214,150,0)");
    g.strokeStyle = tail; g.lineWidth = 10 + i * 18; g.lineCap = "round";
    g.beginPath(); g.moveTo(cx - Math.cos(ang) * L * .5, cy - Math.sin(ang) * L * .5);
    g.lineTo(cx - Math.cos(ang) * L * 4, cy - Math.sin(ang) * L * 4); g.stroke();
  }
  g.filter = "none"; g.restore();

  g.save(); g.translate(cx, cy); g.rotate(ang);
  const metal = (y0, y1) => { const m = g.createLinearGradient(0, y0, 0, y1);
    m.addColorStop(0, "#E8ECF4"); m.addColorStop(.45, "#9AA6BE"); m.addColorStop(1, "#3A4560"); return m; };
  // 幹（背骨）
  g.fillStyle = metal(-7, 7); g.fillRect(-L * .48, -7, L * .86, 14);
  // 居住リング（三つ）
  for (const x of [-L * .12, L * .05, L * .2]) {
    g.fillStyle = metal(-26, 26); g.beginPath(); g.roundRect(x - 13, -26, 26, 52, 6); g.fill();
    g.fillStyle = "rgba(255,226,170,.9)"; for (let k = -2; k <= 2; k++) { g.fillRect(x - 2, k * 9 - 1.5, 4, 3); }
  }
  // 貨物・培養区（やや太い胴）
  g.fillStyle = metal(-18, 18); g.beginPath(); g.roundRect(-L * .36, -18, L * .16, 36, 8); g.fill();
  // 梢（前方の透明ドーム）
  const dome = g.createRadialGradient(L * .44, -6, 2, L * .42, 0, 30);
  dome.addColorStop(0, "rgba(255,255,255,.95)"); dome.addColorStop(.35, "rgba(170,210,255,.75)"); dome.addColorStop(1, "rgba(80,120,200,.25)");
  g.fillStyle = metal(-16, 16); g.fillRect(L * .36, -14, 16, 28);
  g.fillStyle = dome; g.beginPath(); g.ellipse(L * .44, 0, 24, 20, 0, -Math.PI / 2, Math.PI / 2); g.fill();
  g.fillStyle = "rgba(255,236,190,.95)"; g.beginPath(); g.arc(L * .45, 2, 3, 0, 7); g.fill();
  // 根（機関部）とノズル
  g.fillStyle = metal(-22, 22); g.beginPath(); g.roundRect(-L * .52, -22, 26, 44, 5); g.fill();
  g.fillStyle = "#2A3350"; g.beginPath(); g.moveTo(-L * .52, -14); g.lineTo(-L * .6, -20); g.lineTo(-L * .6, 20); g.lineTo(-L * .52, 14); g.fill();
  const fire = g.createRadialGradient(-L * .62, 0, 0, -L * .62, 0, 34);
  fire.addColorStop(0, "rgba(255,250,235,1)"); fire.addColorStop(.3, "rgba(255,200,120,.8)"); fire.addColorStop(1, "rgba(255,160,80,0)");
  g.fillStyle = fire; g.beginPath(); g.arc(-L * .62, 0, 34, 0, 7); g.fill();
  // 通信アレイ（折れた一本）
  g.strokeStyle = "#B9C3D8"; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(L * .08, -26); g.lineTo(L * .12, -54); g.lineTo(L * .18, -60); g.stroke();
  g.beginPath(); g.moveTo(-L * .05, 26); g.lineTo(-L * .02, 44); g.stroke();
  // 光の縁取り（右上からの陽光）
  g.globalCompositeOperation = "lighter"; g.strokeStyle = "rgba(255,240,210,.35)"; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(-L * .48, -7); g.lineTo(L * .38, -7); g.stroke();
  g.restore();
}

function vignette(a){
  const v = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .75);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, `rgba(2,4,18,${a})`);
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

sky(); river(); stars(MODE === "cover" ? 2200 : 1800);
if (MODE === "cover") {
  vignette(.55);
  const st = document.getElementById("stage");
  st.insertAdjacentHTML("beforeend", '<div class="rule"></div><div class="title">銀の川をのぼる</div><div class="team">チームジョバンニ</div>');
} else {
  // 右上の遠い太陽の光
  const sun = g.createRadialGradient(W + 80, -120, 10, W + 80, -120, 900);
  sun.addColorStop(0, "rgba(225,235,255,.28)"); sun.addColorStop(1, "rgba(225,235,255,0)");
  g.fillStyle = sun; g.fillRect(0, 0, W, H);
  earth(560, 700, 165);
  const p = riverPath(.34), q = riverPath(.36);
  const ang = Math.atan2(700 - p.y, 560 - p.x);
  ship(p.x, p.y, ang, 260);
  vignette(.5);
}
document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
</script>
</body></html>
