<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#000}
  #stage{position:relative;width:1600px;height:2560px;overflow:hidden}
  canvas{position:absolute;inset:0}
  .title{position:absolute;right:230px;top:280px;writing-mode:vertical-rl;
    font-family:"Noto Serif CJK JP",serif;font-weight:600;font-size:150px;letter-spacing:.16em}
  .team{position:absolute;left:120px;bottom:150px;
    font-family:"Noto Serif CJK JP",serif;font-weight:600;font-size:42px;letter-spacing:.08em}
  .series{position:absolute;right:120px;top:300px;writing-mode:vertical-rl;
    font-family:"Noto Serif CJK JP",serif;font-weight:500;font-size:34px;letter-spacing:.5em}
  /* 昼（白地）は墨の文字、夜・夕は生成りの文字 */
  .day .title{color:#1f262c;text-shadow:0 0 18px rgba(255,255,255,.7)}
  .day .team,.day .series{color:rgba(31,38,44,.72)}
  .night .title{color:#F2EBDD;text-shadow:0 0 22px rgba(255,214,160,.28),0 0 2px rgba(255,255,255,.55)}
  .night .team,.night .series{color:rgba(232,220,196,.8)}
</style></head>
<body>
<div id="stage"><canvas id="c" width="1600" height="2560"></canvas>
  <div class="title">豆のスープ</div>
  <div class="series">グラウヴァル　四</div>
  <div class="team">チームジョバンニ</div>
</div>
<script>
// 第4回『豆のスープ』の表紙（仮）。#a スープと耳の影 / #b 雪の夜の耳 / #c 衣装箱
// 描かないもの：白いカフス、赤い石、卵の瓶、短剣、人の顔
const MODE = location.hash.slice(1) || "a";
const W = 1600, H = 2560;
let g = document.getElementById("c").getContext("2d");
// ぼかしは縮小キャンバスに描いて拡大する（canvas の filter blur を何百回も使うと重い）
function soft(fn, k = 6, blur = 5){
  const main = g, oc = document.createElement("canvas"); oc.width = W/k; oc.height = H/k;
  const tmp = document.createElement("canvas"); tmp.width = W/k; tmp.height = H/k;
  g = tmp.getContext("2d"); g.scale(1/k, 1/k); fn(); g = main;
  const oc2 = oc.getContext("2d"); oc2.filter = `blur(${blur}px)`; oc2.drawImage(tmp, 0, 0);
  g.save(); g.imageSmoothingQuality = "high"; g.drawImage(oc, 0, 0, W, H); g.restore();
}
let seed = {a: 3091201, b: 3091207, c: 3091224}[MODE] || 1;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
document.getElementById("stage").className = "night";

function grad(stops, y0 = 0, y1 = H, x0 = 0, x1 = 0){
  const lg = g.createLinearGradient(x0, y0, x1, y1);
  stops.forEach(([t, c]) => lg.addColorStop(t, c)); return lg;
}
function glow(x, y, r, col, a0 = 1){
  const rg = g.createRadialGradient(x, y, 0, x, y, r);
  rg.addColorStop(0, col.replace("A", a0)); rg.addColorStop(1, col.replace("A", 0));
  g.fillStyle = rg; g.fillRect(x - r, y - r, 2*r, 2*r);
}
function snowfall(n, col, aMax, x0 = 0, y0 = 0, w = W, h = H, rMax = 5){
  for (let i = 0; i < n; i++){
    const x = x0 + rnd()*w, y = y0 + rnd()*h, r = Math.pow(rnd(), 2)*rMax + 1, a = .15 + rnd()*aMax;
    const rg = g.createRadialGradient(x, y, 0, x, y, r*2.2);
    rg.addColorStop(0, `rgba(${col},${a})`); rg.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r*2.2, 0, 7); g.fill();
  }
}
function vignette(a, cx = W/2, cy = H*.5){
  const rg = g.createRadialGradient(cx, cy, H*.25, cx, cy + H*.05, H*.8);
  rg.addColorStop(0, "rgba(0,0,0,0)"); rg.addColorStop(1, `rgba(0,0,0,${a})`);
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
}
// 画面全体にうすい粒子（絵の具の目）
function filmGrain(n, a){
  for (let i = 0; i < n; i++){ g.fillStyle = `rgba(${rnd() < .5 ? "0,0,0" : "255,240,220"},${rnd()*a})`; g.fillRect(rnd()*W, rnd()*H, 1 + rnd()*2, 1 + rnd()*2); }
}
// 三次ベジェ
function bez(P, t){ const u = 1 - t; return [0, 1].map(k => u*u*u*P[0][k] + 3*u*u*t*P[1][k] + 3*u*t*t*P[2][k] + t*t*t*P[3][k]); }
function bezD(P, t){ const u = 1 - t; return [0, 1].map(k => 3*u*u*(P[1][k] - P[0][k]) + 6*u*t*(P[2][k] - P[1][k]) + 3*t*t*(P[3][k] - P[2][k])); }
// 中心線 P に沿った帯（耳の形など）
function ribbon(P, wfn, n = 70){
  const L = [], R = [];
  for (let i = 0; i <= n; i++){
    const t = i/n, [x, y] = bez(P, t), [dx, dy] = bezD(P, t), l = Math.hypot(dx, dy) || 1, nx = -dy/l, ny = dx/l, w = wfn(t);
    L.push([x + nx*w, y + ny*w]); R.push([x - nx*w, y - ny*w]);
  }
  g.beginPath(); L.forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); R.reverse().forEach(p => g.lineTo(...p)); g.closePath();
}
const earW = (wm, b = .5) => t => wm*(b + (1 - b)*Math.sin(Math.PI/2*Math.min(t/.45, 1)))*(t > .62 ? Math.sqrt(Math.max(0, 1 - Math.pow((t - .62)/.38, 2))) : 1);
// 木目の板（横方向の板、奥 y0 から手前 y1 へ遠近）
function planks(y0, y1, x0, x1, base, dark, light, nSeam, nGrain){
  g.fillStyle = base; g.fillRect(x0, y0, x1 - x0, y1 - y0);
  for (let k = 1; k < nSeam; k++){
    const y = y0 + (y1 - y0)*Math.pow(k/nSeam, 1.5), p = (y - y0)/(y1 - y0);
    g.fillStyle = `rgba(${dark},.55)`; g.fillRect(x0, y - 1 - p*2, x1 - x0, 2 + p*4);
    g.fillStyle = `rgba(${light},.10)`; g.fillRect(x0, y + 2 + p*3, x1 - x0, 1 + p*2);
  }
  g.lineCap = "round";
  for (let i = 0; i < nGrain; i++){
    const y = y0 + (y1 - y0)*Math.pow(rnd(), 1.3), p = (y - y0)/(y1 - y0), xs = x0 + rnd()*(x1 - x0), L = 200 + rnd()*900;
    g.strokeStyle = `rgba(${rnd() < .6 ? dark : light},${.04 + rnd()*.10})`; g.lineWidth = .6 + p*3*rnd();
    g.beginPath(); const ph = rnd()*7, amp = (1 + p*4)*rnd();
    for (let s = 0; s <= 20; s++){ const x = xs - L/2 + L*s/20, yy = y + Math.sin(s*.7 + ph)*amp; s ? g.lineTo(x, yy) : g.moveTo(x, yy); }
    g.stroke();
  }
}
// 湯気
function steam(x0, y0, h, col, n = 6, spread = 60){
  g.save(); g.lineCap = "round";
  for (let k = 0; k < n; k++){
    const sg = g.createLinearGradient(0, y0, 0, y0 - h);
    sg.addColorStop(0, `rgba(${col},0)`); sg.addColorStop(.12, `rgba(${col},${.20 - k*.015})`); sg.addColorStop(1, `rgba(${col},0)`);
    g.strokeStyle = sg; g.lineWidth = 10 + k*9; g.filter = `blur(${6 + k*4}px)`;
    const ph = rnd()*7, dx = (k - n/2)*spread/n, drift = (rnd() - .3)*120, hh = h*(.6 + rnd()*.4);
    g.beginPath();
    for (let s = 0; s <= 40; s++){ const t = s/40, y = y0 - t*hh, x = x0 + dx*(1 - t*.4) + Math.sin(t*7 + ph)*50*t + drift*t*t; s ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke();
  }
  g.restore();
}

// ── 案A スープと耳の影 ─────────────────────
function drawA(){
  const cy = H*.63, lx = W*.16, ly = H*.79;
  // 漆喰の壁
  g.fillStyle = grad([[0, "#140d09"], [.35, "#2c1c12"], [1, "#4a301e"]], 0, cy); g.fillRect(0, 0, W, cy);
  soft(() => { for (let i = 0; i < 160; i++){ g.fillStyle = `rgba(${rnd() < .5 ? "120,84,52" : "18,10,6"},${.08 + rnd()*.18})`;
    g.beginPath(); g.ellipse(rnd()*W, rnd()*cy, 60 + rnd()*260, 30 + rnd()*120, rnd()*3, 0, 7); g.fill(); } }, 6, 4);
  // 灯の照り返し（左下の灯から壁へ）
  glow(lx + 120, cy - 120, 1500, "rgba(255,160,80,A)", .30);
  glow(lx + 200, cy - 60, 700, "rgba(255,196,120,A)", .26);
  // 古い梁と棚（左上、器のシルエット）
  g.fillStyle = "rgba(20,12,8,.85)"; g.fillRect(0, H*.135, W*.55, 26);
  g.fillStyle = "rgba(120,80,48,.25)"; g.fillRect(0, H*.135, W*.55, 4);
  for (const [x, w, h, kind] of [[110, 110, 170, 0], [260, 80, 120, 1], [380, 130, 90, 2], [560, 70, 150, 0]]){
    g.save(); g.fillStyle = "rgba(24,15,10,.9)"; g.beginPath(); const y = H*.135;
    if (kind === 0){ g.moveTo(x, y); g.bezierCurveTo(x - w*.6, y - h*.4, x - w*.3, y - h*.8, x - w*.15, y - h); g.lineTo(x + w*.15, y - h); g.bezierCurveTo(x + w*.3, y - h*.8, x + w*.6, y - h*.4, x, y); }
    else if (kind === 1){ g.rect(x - w/2, y - h, w, h); }
    else { g.ellipse(x, y - h/2, w/2, h/2, 0, 0, 7); }
    g.fill(); g.fillStyle = "rgba(255,180,110,.10)"; g.fillRect(x - w*.45, y - h*.9, 6, h*.7); g.restore();
  }
  // 兎の耳の影（壁に大きく、柔らかく）
  const sx = W*.40, sy = cy - 10;
  const shadowShape = () => {
    g.fillStyle = "rgba(14,7,3,1)";
    g.beginPath(); g.ellipse(sx, sy, 270, 230, 0, 0, 7); g.fill();
    // 起き上がりかけた右耳（少し反って先がまだ寝ている）
    ribbon([[sx + 70, sy - 170], [sx + 100, sy - 500], [sx + 170, sy - 790], [sx + 280, sy - 1000]], earW(92)); g.fill();
    // 伏せた左耳
    ribbon([[sx - 80, sy - 180], [sx - 110, sy - 470], [sx - 360, sy - 560], [sx - 480, sy - 330]], earW(86)); g.fill();
    // 髪のほつれ
    for (let i = 0; i < 6; i++){ const a = -Math.PI*(.1 + rnd()*.25)*(rnd() < .5 ? 1 : -1) - (rnd() < .5 ? 0 : Math.PI); g.save(); g.translate(sx + Math.cos(a)*262, sy + Math.sin(a)*222); g.rotate(a + Math.PI/2);
      g.beginPath(); g.ellipse(0, -10, 5 + rnd()*5, 18 + rnd()*14, (rnd() - .5)*.6, 0, 7); g.fill(); g.restore(); }
  };
  g.save(); g.globalAlpha = .38; soft(shadowShape, 4, 12); g.restore();
  g.save(); g.globalAlpha = .55; soft(shadowShape, 4, 3); g.restore();
  // カウンター（奥の縁）
  g.fillStyle = "rgba(10,6,4,.8)"; g.fillRect(0, cy - 6, W, 12);
  planks(cy, H, 0, W, "#3b2416", "16,9,5", "220,160,100", 6, 900);
  // ニス面の照り返し
  g.save(); g.globalCompositeOperation = "screen";
  glow(lx, ly - 40, 700, "rgba(255,150,70,A)", .35);
  g.filter = "blur(30px)"; g.fillStyle = "rgba(255,170,90,.22)"; g.beginPath(); g.ellipse(lx + 40, H*.92, 90, 260, 0, 0, 7); g.fill();
  g.restore();
  g.fillStyle = grad([[0, "rgba(255,190,120,.16)"], [1, "rgba(255,190,120,0)"]], cy, cy + 40); g.fillRect(0, cy, W, 40);
  // 杯の輪じみ
  for (const [x, y, r] of [[W*.82, H*.70, 70], [W*.30, H*.67, 50]]){ g.strokeStyle = "rgba(20,10,5,.30)"; g.lineWidth = 5; g.beginPath(); g.ellipse(x, y, r, r*.32, 0, 0, 7); g.stroke(); }

  // 木の椀（白豆のスープ）
  const bx = W*.54, by = H*.745, rx = 250, ry = 72;
  g.save(); g.filter = "blur(18px)"; g.fillStyle = "rgba(8,4,2,.75)"; g.beginPath(); g.ellipse(bx + 70, by + 190, 290, 52, 0, 0, 7); g.fill(); g.restore();
  // 胴
  const bodyG = g.createLinearGradient(bx - rx, 0, bx + rx, 0);
  bodyG.addColorStop(0, "#a8673a"); bodyG.addColorStop(.25, "#8a5230"); bodyG.addColorStop(.7, "#4c2a16"); bodyG.addColorStop(1, "#2a160b");
  g.fillStyle = bodyG; g.beginPath(); g.moveTo(bx - rx, by);
  g.bezierCurveTo(bx - rx + 10, by + 150, bx - 120, by + 185, bx - 90, by + 190); g.lineTo(bx + 90, by + 190);
  g.bezierCurveTo(bx + 120, by + 185, bx + rx - 10, by + 150, bx + rx, by); g.closePath(); g.fill();
  // 木目（胴）
  g.save(); g.clip();
  for (let i = 0; i < 40; i++){ g.strokeStyle = `rgba(${rnd() < .5 ? "30,14,6" : "210,150,100"},${.08 + rnd()*.12})`; g.lineWidth = 1 + rnd()*2.5;
    const y = by + 10 + rnd()*170; g.beginPath(); g.moveTo(bx - rx, y); g.quadraticCurveTo(bx, y + 20 + rnd()*20, bx + rx, y); g.stroke(); }
  g.filter = "blur(10px)"; g.fillStyle = "rgba(255,200,140,.35)"; g.beginPath(); g.ellipse(bx - 170, by + 70, 30, 80, -.2, 0, 7); g.fill();
  g.restore();
  // 高台
  g.fillStyle = "#2a160b"; g.beginPath(); g.ellipse(bx, by + 190, 96, 16, 0, 0, 7); g.fill();
  // 縁
  g.fillStyle = "#9b6038"; g.beginPath(); g.ellipse(bx, by, rx, ry, 0, 0, 7); g.fill();
  g.fillStyle = "#3a2010"; g.beginPath(); g.ellipse(bx, by + 3, rx - 16, ry - 10, 0, 0, 7); g.fill();
  // スープの面
  const sg = g.createRadialGradient(bx - 60, by - 6, 10, bx, by + 6, rx - 20);
  sg.addColorStop(0, "#f3e6c8"); sg.addColorStop(.6, "#dcc79c"); sg.addColorStop(1, "#a88a5c");
  g.fillStyle = sg; g.beginPath(); g.ellipse(bx, by + 10, rx - 28, ry - 20, 0, 0, 7); g.fill();
  g.save(); g.beginPath(); g.ellipse(bx, by + 10, rx - 28, ry - 20, 0, 0, 7); g.clip();
  // 白豆
  for (let i = 0; i < 38; i++){
    const a = rnd()*7, rr = Math.sqrt(rnd()), x = bx + Math.cos(a)*rr*(rx - 60), y = by + 10 + Math.sin(a)*rr*(ry - 32), s = 15 + rnd()*6;
    g.fillStyle = "rgba(120,92,56,.45)"; g.beginPath(); g.ellipse(x + 2, y + 3, s, s*.64, (a % .8) - .4, 0, 7); g.fill();
    g.fillStyle = `rgb(${236 + rnd()*14|0},${226 + rnd()*14|0},${198 + rnd()*14|0})`; g.beginPath(); g.ellipse(x, y, s, s*.62, (a % .8) - .4, 0, 7); g.fill();
    g.fillStyle = "rgba(255,255,245,.7)"; g.beginPath(); g.ellipse(x - s*.3, y - s*.22, s*.38, s*.16, (a % .8) - .4, 0, 7); g.fill();
  }
  // 香草のかけら・油の玉
  for (let i = 0; i < 26; i++){ g.fillStyle = `rgba(${rnd() < .6 ? "70,90,40" : "150,110,50"},${.5 + rnd()*.4})`; g.fillRect(bx + (rnd() - .5)*(rx*1.5), by + 10 + (rnd() - .5)*(ry - 20)*1.4, 3 + rnd()*4, 2 + rnd()*3); }
  g.filter = "blur(6px)"; g.fillStyle = "rgba(255,240,210,.55)"; g.beginPath(); g.ellipse(bx - 90, by + 2, 70, 12, 0, 0, 7); g.fill();
  g.restore();
  // 縁の光
  g.strokeStyle = "rgba(255,210,150,.55)"; g.lineWidth = 3; g.beginPath(); g.ellipse(bx, by, rx - 2, ry - 2, 0, Math.PI*.55, Math.PI*1.35); g.stroke();
  // 木の匙
  g.save(); g.translate(bx + 120, by + 4); g.rotate(-.30);
  g.fillStyle = "#b07a4a"; g.beginPath(); g.roundRect(0, -10, 330, 20, 10); g.fill();
  g.fillStyle = "rgba(60,30,14,.5)"; g.fillRect(10, 4, 310, 6);
  g.fillStyle = "rgba(255,220,170,.4)"; g.fillRect(20, -8, 290, 4);
  g.restore();
  // 湯気（壁の影の前を昇る）
  steam(bx - 20, by - 10, 900, "255,236,210", 7, 160);

  // 油の灯（左手前）
  g.save(); g.filter = "blur(14px)"; g.fillStyle = "rgba(6,3,1,.7)"; g.beginPath(); g.ellipse(lx + 60, ly + 20, 170, 30, 0, 0, 7); g.fill(); g.restore();
  const bg = g.createLinearGradient(lx - 110, 0, lx + 110, 0); bg.addColorStop(0, "#d79a52"); bg.addColorStop(.4, "#8a5a2a"); bg.addColorStop(1, "#2e1c0c");
  g.fillStyle = bg; g.beginPath(); g.ellipse(lx, ly, 120, 26, 0, 0, 7); g.fill();
  g.beginPath(); g.moveTo(lx - 30, ly - 6); g.lineTo(lx - 22, ly - 90); g.lineTo(lx + 22, ly - 90); g.lineTo(lx + 30, ly - 6); g.fill();
  g.beginPath(); g.ellipse(lx, ly - 140, 100, 58, 0, 0, 7); g.fill();
  g.fillStyle = "rgba(255,220,150,.5)"; g.beginPath(); g.ellipse(lx - 50, ly - 155, 26, 12, -.3, 0, 7); g.fill();
  // 火屋（硝子）
  const cx0 = lx, cTop = ly - 470, cBot = ly - 186;
  g.fillStyle = "rgba(255,210,150,.10)"; g.beginPath(); g.moveTo(cx0 - 60, cBot); g.bezierCurveTo(cx0 - 110, cBot - 90, cx0 - 80, cBot - 160, cx0 - 36, cTop + 60); g.lineTo(cx0 - 36, cTop);
  g.lineTo(cx0 + 36, cTop); g.lineTo(cx0 + 36, cTop + 60); g.bezierCurveTo(cx0 + 80, cBot - 160, cx0 + 110, cBot - 90, cx0 + 60, cBot); g.closePath(); g.fill();
  g.strokeStyle = "rgba(255,230,190,.35)"; g.lineWidth = 3; g.stroke();
  g.fillStyle = "#6a4420"; g.fillRect(cx0 - 70, cBot - 6, 140, 18);
  // 炎
  g.save(); g.globalCompositeOperation = "lighter";
  glow(cx0, cBot - 110, 520, "rgba(255,150,60,A)", .45);
  glow(cx0, cBot - 110, 160, "rgba(255,210,130,A)", .65);
  const fl = (h, w, col, b) => { g.filter = `blur(${b}px)`; g.fillStyle = col; g.beginPath(); g.moveTo(cx0 - w, cBot - 20);
    g.bezierCurveTo(cx0 - w, cBot - 20 - h*.5, cx0 - w*.3, cBot - 20 - h*.8, cx0, cBot - 20 - h); g.bezierCurveTo(cx0 + w*.3, cBot - 20 - h*.8, cx0 + w, cBot - 20 - h*.5, cx0 + w, cBot - 20); g.closePath(); g.fill(); };
  fl(170, 28, "rgba(255,140,40,.7)", 6); fl(120, 18, "rgba(255,220,130,.9)", 3); fl(60, 9, "rgba(255,255,230,.95)", 2);
  g.restore();
  filmGrain(9000, .06);
  vignette(.55, W*.45, H*.55);
}

// ── 案B 雪の夜の耳 ─────────────────────
function drawB(){
  const fx = W*.48, fy = H*.62;
  // 酒場の奥の壁（暗い板と石）
  g.fillStyle = grad([[0, "#0b0a0c"], [.5, "#1c1410"], [1, "#0d0907"]]); g.fillRect(0, 0, W, H);
  for (let x = 0; x < W; x += 110 + (rnd()*40|0)){ g.fillStyle = `rgba(${rnd() < .5 ? "60,40,28" : "8,5,4"},${.25 + rnd()*.25})`; g.fillRect(x, 0, 6, H*.72); }
  // 床
  planks(H*.72, H, 0, W, "#1b120c", "6,3,2", "200,130,80", 7, 500);
  // 暖炉の照り返し
  glow(fx, fy, 1500, "rgba(255,130,50,A)", .32);
  glow(fx, fy, 700, "rgba(255,170,90,A)", .30);
  // 窓（左上、雪の夜）
  const wx = 110, wy = 330, ww = 440, wh = 640;
  g.fillStyle = "#1a1410"; g.fillRect(wx - 40, wy - 40, ww + 80, wh + 80);
  const sky = g.createLinearGradient(0, wy, 0, wy + wh); sky.addColorStop(0, "#0e1a30"); sky.addColorStop(1, "#2a3a58");
  g.fillStyle = sky; g.fillRect(wx, wy, ww, wh);
  g.save(); g.beginPath(); g.rect(wx, wy, ww, wh); g.clip();
  // 向かいの屋根と灯
  g.fillStyle = "#0a1020"; g.beginPath(); g.moveTo(wx, wy + wh*.55); g.lineTo(wx + ww*.35, wy + wh*.38); g.lineTo(wx + ww*.7, wy + wh*.55); g.lineTo(wx + ww, wy + wh*.5); g.lineTo(wx + ww, wy + wh); g.lineTo(wx, wy + wh); g.fill();
  g.fillStyle = "#cfd8e8"; g.beginPath(); g.moveTo(wx, wy + wh*.55); g.lineTo(wx + ww*.35, wy + wh*.38); g.lineTo(wx + ww*.7, wy + wh*.55); g.lineTo(wx + ww*.7, wy + wh*.57); g.lineTo(wx + ww*.35, wy + wh*.41); g.lineTo(wx, wy + wh*.58); g.fill();
  glow(wx + ww*.32, wy + wh*.7, 90, "rgba(255,190,110,A)", .7);

  g.fillStyle = "#151312"; g.fillRect(cx - 50, fT, 100, 150); g.fillStyle = "#26221f"; g.beginPath(); g.arc(cx, fT + 150, 46, 0, Math.PI); g.fill();
  g.fillStyle = "#050404"; g.fillRect(cx - 7, fT + 110, 14, 40);
  g.fillStyle = "rgba(255,220,170,.22)"; g.fillRect(cx - 50, fT, 100, 3);
  // 黒い布
  const clG = g.createLinearGradient(cx - hw, 0, cx, 0); clG.addColorStop(0, "#0c0b0e"); clG.addColorStop(.6, "#1e1c22"); clG.addColorStop(1, "#0c0b0e");
  g.fillStyle = clG; cloth(); g.fill();
  g.save(); cloth(); g.clip();
  for (let i = 0; i < 9; i++){ const x = cx - hw + 60 + i*55 + rnd()*20; g.strokeStyle = `rgba(${rnd() < .5 ? "90,86,100" : "0,0,0"},${.25 + rnd()*.2})`; g.lineWidth = 8 + rnd()*14; g.filter = "blur(6px)";
    g.beginPath(); g.moveTo(x, bT); g.bezierCurveTo(x + 30, fT, x - 20, fT + 150, x - 40 + rnd()*30, fT + 380); g.stroke(); }
  g.filter = "blur(20px)"; g.fillStyle = "rgba(255,220,170,.10)"; g.beginPath(); g.ellipse(cx - 120, fT, 140, 90, 0, 0, 7); g.fill();
  g.restore();
  // 道化の帽子（右側、くたびれた二股、真鍮の鈴）
  const jx = cx + 300, jy = bT + 50;
  g.save();
  g.fillStyle = "#3d3a2a"; g.beginPath(); g.ellipse(jx, jy + 20, 150, 70, -.1, Math.PI, 0); g.fill();
  g.fillStyle = "#2c2a20"; g.beginPath(); g.ellipse(jx, jy + 20, 150, 26, -.1, 0, 7); g.fill();
  const horn = (P, col) => { g.fillStyle = col; ribbon(P, t => 44*Math.pow(1 - t, .8) + 6); g.fill(); };
  horn([[jx - 60, jy - 20], [jx - 140, jy - 180], [jx - 280, jy - 160], [jx - 300, jy - 40]], "#5c3f2c");
  horn([[jx + 50, jy - 30], [jx + 110, jy - 220], [jx + 260, jy - 200], [jx + 300, jy + 10]], "#3e4a38");
  // 菱形の色あせた継ぎ
  g.save(); g.beginPath(); g.ellipse(jx, jy + 20, 150, 70, -.1, Math.PI, 0); g.clip();
  for (let i = 0; i < 6; i++){ g.fillStyle = i % 2 ? "rgba(120,100,60,.35)" : "rgba(70,90,70,.35)"; g.beginPath(); const x = jx - 140 + i*50; g.moveTo(x, jy + 20); g.lineTo(x + 25, jy - 30); g.lineTo(x + 50, jy + 20); g.lineTo(x + 25, jy + 70); g.fill(); }
  g.restore();
  for (const [bxx, byy] of [[jx - 300, jy - 34], [jx + 300, jy + 16]]){ const bg2 = g.createRadialGradient(bxx - 6, byy - 8, 2, bxx, byy, 24); bg2.addColorStop(0, "#e8c87a"); bg2.addColorStop(.5, "#9a7a3a"); bg2.addColorStop(1, "#3a2c14");
    g.fillStyle = bg2; g.beginPath(); g.arc(bxx, byy, 22, 0, 7); g.fill(); g.fillStyle = "#120d06"; g.fillRect(bxx - 10, byy + 6, 20, 4); }
  g.restore();

  // 虫食いの灰色の付け耳（毛のはげた兎耳、光の中）
  const ex = cx + 40, ey = bT + 80;
  // カチューシャ（弓なりの帯）
  g.save(); g.strokeStyle = "#5a554e"; g.lineWidth = 26; g.lineCap = "round"; g.beginPath(); g.ellipse(ex, ey + 40, 210, 70, -.08, Math.PI*1.05, Math.PI*1.95); g.stroke();
  g.strokeStyle = "rgba(255,230,190,.35)"; g.lineWidth = 4; g.beginPath(); g.ellipse(ex, ey + 32, 210, 70, -.08, Math.PI*1.1, Math.PI*1.9); g.stroke(); g.restore();
  const fakeEar = (P, wm) => {
    const [mx, my] = bez(P, .4);
    const eg = g.createLinearGradient(mx - wm, my - wm, mx + wm, my + wm); eg.addColorStop(0, "#a29d97"); eg.addColorStop(1, "#5e5a56");
    g.fillStyle = eg; ribbon(P, earW(wm, .25)); g.fill();
    g.save(); ribbon(P, earW(wm, .25)); g.clip();
    // 内側（色あせた桃色の布）
    g.fillStyle = "rgba(170,130,120,.55)"; ribbon(P, earW(wm*.5, .25)); g.fill();
    // 毛並み
    for (let i = 0; i < 380; i++){ const t = rnd(), [x, y] = bez(P, t), [dx, dy] = bezD(P, t), l = Math.hypot(dx, dy), off = (rnd() - .5)*2*earW(wm, .25)(t), nx = -dy/l, ny = dx/l;
      const px = x + nx*off, py = y + ny*off; g.strokeStyle = rnd() < .5 ? `rgba(220,214,206,${.15 + rnd()*.2})` : `rgba(40,38,36,${.1 + rnd()*.2})`; g.lineWidth = 1 + rnd()*1.5;
      g.beginPath(); g.moveTo(px, py); g.lineTo(px + dx/l*14, py + dy/l*14); g.stroke(); }
    // はげ（下地の革がのぞく）と虫食い穴
    for (let i = 0; i < 3; i++){ const t = .25 + rnd()*.6, [x, y] = bez(P, t); g.fillStyle = "rgba(140,116,90,.7)"; g.filter = "blur(3px)"; g.beginPath(); g.ellipse(x + (rnd() - .5)*wm*.8, y + (rnd() - .5)*wm*.5, 16 + rnd()*20, 10 + rnd()*10, rnd()*3, 0, 7); g.fill(); g.filter = "none"; }
    for (let i = 0; i < 4; i++){ const t = .1 + rnd()*.85, [x, y] = bez(P, t); g.fillStyle = "rgba(10,8,6,.85)"; g.beginPath(); g.ellipse(x + (rnd() - .5)*wm*1.2, y + (rnd() - .5)*wm*.8, 3 + rnd()*6, 2 + rnd()*4, rnd()*3, 0, 7); g.fill(); }
    // 上からの光
    g.globalCompositeOperation = "screen"; g.filter = "blur(14px)"; g.fillStyle = "rgba(255,220,160,.35)"; g.beginPath(); g.ellipse(mx - 10, my - 20, wm*1.4, wm*1.8, 0, 0, 7); g.fill();
    g.restore();
  };
  // 一本は蓋にもたれて立ち、一本は布の上にくたりと寝る
  fakeEar([[ex + 70, ey - 25], [ex + 80, ey - 200], [ex + 110, ey - 340], [ex + 150, ey - 470]], 62);
  fakeEar([[ex - 80, ey - 25], [ex - 130, ey - 230], [ex - 310, ey - 250], [ex - 390, ey - 70]], 60);
  // 光の中の塵
  for (let i = 0; i < 520; i++){ const t = rnd(), y = t*H*.8, xl = cx - 40 + t*(-290), xr = cx + 230 + t*330, x = xl + rnd()*(xr - xl), r = .6 + Math.pow(rnd(), 3)*3;
    g.fillStyle = `rgba(255,236,200,${.15 + rnd()*.5})`; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
  // 蜘蛛の巣（右上隅）
  g.strokeStyle = "rgba(200,190,170,.10)"; g.lineWidth = 1.2;
  for (let k = 0; k < 7; k++){ const a = Math.PI*.5 + k*.22; g.beginPath(); g.moveTo(W, 0); g.lineTo(W + Math.cos(a)*420, Math.sin(a)*420); g.stroke(); }
  for (let r = 60; r < 420; r += 60){ g.beginPath(); for (let k = 0; k < 7; k++){ const a = Math.PI*.5 + k*.22; const x = W + Math.cos(a)*r, y = Math.sin(a)*r; k ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
  filmGrain(10000, .07);
  vignette(.6, cx, H*.6);
}
