<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}#stage{width:1600px;height:2400px;position:relative}canvas{position:absolute;inset:0}</style>
</head><body><div id="stage"><canvas id="c" width="1600" height="2400"></canvas></div>
<script>
const W=1600,H=2400,g=document.getElementById('c').getContext('2d');
let seed=313111;const R=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);
const INK='rgba(58,36,20,', FONT='"Noto Serif CJK JP",serif';
function ink(a){return INK+a+')';}
// ---------- parchment
function parchment(){
  const gr=g.createRadialGradient(W/2,H/2,300,W/2,H/2,1500);
  gr.addColorStop(0,'#efe1bf');gr.addColorStop(.6,'#e2cc9c');gr.addColorStop(1,'#b8925c');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  // fibers / noise
  const id=g.getImageData(0,0,W,H),d=id.data;
  for(let i=0;i<d.length;i+=4){const n=(R()-.5)*22;d[i]+=n;d[i+1]+=n*.92;d[i+2]+=n*.8;}
  g.putImageData(id,0,0);
  // stains
  for(let k=0;k<26;k++){const x=R()*W,y=R()*H,r=40+R()*220;
    const s=g.createRadialGradient(x,y,r*.2,x,y,r);s.addColorStop(0,'rgba(120,80,30,0)');s.addColorStop(.85,'rgba(120,80,30,'+(0.04+R()*.06)+')');s.addColorStop(1,'rgba(120,80,30,0)');
    g.fillStyle=s;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
  // burnt edges
  const e=g.createLinearGradient(0,0,0,H);
  for(const [x0,y0,x1,y1] of [[0,0,0,140],[0,H,0,H-140],[0,0,140,0],[W,0,W-140,0]]){
    const l=g.createLinearGradient(x0,y0,x1,y1);l.addColorStop(0,'rgba(70,40,15,.55)');l.addColorStop(1,'rgba(70,40,15,0)');g.fillStyle=l;g.fillRect(0,0,W,H);}
  // fold lines
  g.strokeStyle='rgba(90,60,30,.10)';g.lineWidth=3;
  g.beginPath();g.moveTo(W/2,0);g.lineTo(W/2,H);g.moveTo(0,H/2);g.lineTo(W,H/2);g.stroke();
}
// ---------- hand-drawn primitives
function wob(pts,amp=2.2,closed=false,lw=3,a=.85){
  g.strokeStyle=ink(a);g.lineWidth=lw;g.lineCap='round';g.lineJoin='round';
  for(let pass=0;pass<2;pass++){
    g.beginPath();
    const P=closed?pts.concat([pts[0]]):pts;
    for(let i=0;i<P.length-1;i++){const [x0,y0]=P[i],[x1,y1]=P[i+1];const n=Math.max(2,Math.hypot(x1-x0,y1-y0)/14|0);
      for(let j=0;j<=n;j++){const t=j/n,x=x0+(x1-x0)*t+(R()-.5)*amp,y=y0+(y1-y0)*t+(R()-.5)*amp; (i==0&&j==0)?g.moveTo(x,y):g.lineTo(x,y);} }
    g.stroke(); g.lineWidth=lw*.5; }
}
function label(t,x,y,size=34,a=.9,weight=600,align='center',angle=0){
  g.save();g.translate(x,y);g.rotate(angle);g.font=`${weight} ${size}px ${FONT}`;g.textAlign=align;g.textBaseline='middle';
  g.fillStyle='rgba(239,225,191,.55)';for(const [dx,dy] of [[-2,0],[2,0],[0,-2],[0,2]])g.fillText(t,dx,dy);
  g.fillStyle=ink(a);g.fillText(t,0,0);g.restore();
}
function house(x,y,s=1,fill='rgba(200,170,120,.0)'){
  const w=26*s,h=18*s;g.fillStyle='rgba(239,225,191,.6)';g.fillRect(x-w/2,y-h/2,w,h);
  wob([[x-w/2,y+h/2],[x-w/2,y-h/2],[x,y-h/2-12*s],[x+w/2,y-h/2],[x+w/2,y+h/2]],1.2,true,2,.75);
}
function tower(x,y,s=1){wob([[x-12*s,y+16*s],[x-12*s,y-16*s],[x-6*s,y-16*s],[x-6*s,y-22*s],[x,y-22*s],[x,y-16*s],[x+6*s,y-16*s],[x+6*s,y-22*s],[x+12*s,y-22*s],[x+12*s,y+16*s]],1,true,2.5,.85);}
function tree(x,y,s=1){wob([[x,y],[x,y-10*s]],.6,false,2,.6);g.strokeStyle=ink(.6);g.lineWidth=2;g.beginPath();g.arc(x,y-16*s,8*s,0,7);g.stroke();}
function hachure(cx,cy,rx,ry,n,a=.25){ // hill strokes around a contour
  for(let i=0;i<n;i++){const t=R()*Math.PI*2,r=1+R()*.25,x=cx+Math.cos(t)*rx*r,y=cy+Math.sin(t)*ry*r;
    const dx=Math.cos(t)*18,dy=Math.sin(t)*18; wob([[x,y],[x+dx,y+dy]],.8,false,1.6,a);} }
// ---------- draw
parchment();
// outer frame
wob([[60,60],[W-60,60],[W-60,H-60],[60,H-60]],2,true,4,.7);
wob([[78,78],[W-78,78],[W-78,H-78],[78,H-78]],1.5,true,1.5,.6);

// hill hachures outside the wall
hachure(800,1350,640,760,700,.22);
// scattered trees / wasteland
for(let i=0;i<90;i++){const x=120+R()*1360,y=130+R()*2140; const dx=(x-800)/640,dy=(y-1350)/760; if(dx*dx+dy*dy<1.25)continue; tree(x,y,.8+R()*.4);}

// north road + milestones + thorn grass
const nroad=[[800,640],[790,520],[815,400],[800,280],[820,140],[830,90]];
wob(nroad,3,false,4,.8); wob(nroad.map(([x,y])=>[x+22,y]),3,false,2,.55);
for(const [i,[x,y]] of [[1,[790,520]],[2,[815,400]],[3,[800,280]]]){
  g.fillStyle=ink(.85);g.fillRect(x+30,y-12,10,24); label(`${['','一','二','三'][i]}つ目の一里塚`,x+52,y,24,.8,500,'left');}
for(let i=0;i<160;i++){const y=110+R()*280,x=640+R()*360; if(Math.abs(x-812)<34)continue; g.fillStyle='rgba(150,40,30,'+(.35+R()*.35)+')';g.beginPath();g.arc(x,y,2+R()*2.5,0,7);g.fill();
  wob([[x,y],[x+(R()-.5)*14,y-8-R()*8]],.5,false,1.2,.45);}
label('赤い棘草の荒れ野',520,250,26,.75,500,'center');
label('北街道',900,190,34,.85,700,'left');
label('↑ 北の村々・灰色山脈へ',820,112,24,.75,500,'left');

// city wall polygon
const wall=[[800,660],[1050,700],[1280,870],[1390,1150],[1370,1500],[1270,1790],[1150,1925],[1000,2030],[880,2060],[720,2060],[560,1990],[390,1800],[270,1500],[260,1160],[360,890],[560,710]];
g.fillStyle='rgba(225,205,160,.55)';g.beginPath();wall.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill();
wob(wall,2.5,true,9,.85); wob(wall.map(([x,y])=>[x+(x-800)*.02,y+(y-1350)*.02]),2,true,2.5,.6);
// crenels
for(let i=0;i<wall.length;i++){const [x0,y0]=wall[i],[x1,y1]=wall[(i+1)%wall.length];const L=Math.hypot(x1-x0,y1-y0),n=L/34|0;
  for(let j=1;j<n;j++){const t=j/n,x=x0+(x1-x0)*t,y=y0+(y1-y0)*t,nx=(y1-y0)/L,ny=-(x1-x0)/L; g.fillStyle=ink(.75);g.fillRect(x+nx*8-4,y+ny*8-4,8,8);}}
// north gate with two towers
tower(760,668,1.3);tower(842,668,1.3); g.fillStyle='rgba(239,225,191,1)';g.fillRect(784,655,34,26); wob([[786,680],[786,660],[816,660],[816,680]],1,false,2.5,.85);
label('北門（追放の門）',800,600,32,.95,700);
// ice house
house(700,770,1.1); label('北の氷室',700,812,24,.8,500);
// upper town houses
for(let i=0;i<34;i++){const x=470+R()*700,y=780+R()*300; if(Math.hypot(x-700,y-770)<70||Math.hypot(x-1000,y-900)<80||Math.hypot(x-640,y-1010)<80||Math.abs(x-800)<30&&y<760)continue; house(x,y,.75+R()*.2);}
label('上町',930,780,40,.9,700); label('（丘の上・白漆喰の屋敷）',930,822,22,.7,500);
// Rosmond manor
wob([[945,880],[1055,880],[1055,940],[945,940]],1.5,true,3,.9); wob([[945,880],[1000,850],[1055,880]],1.5,false,3,.9);
g.strokeStyle=ink(.8);g.lineWidth=2;g.strokeRect(988,862,24,14);
label('ロズモンド館',1000,970,26,.9,600);
// council hall
wob([[585,995],[700,995],[700,1050],[585,1050]],1.5,true,3,.9);for(let k=0;k<5;k++)wob([[598+k*24,1003],[598+k*24,1045]],.6,false,1.5,.7);
label('市参事会館',642,1078,26,.9,600); label('（裁きの間）',642,1108,20,.7,500);
// cathedral
wob([[730,1130],[830,1130],[830,1200],[730,1200]],1.5,true,3,.9);wob([[760,1130],[760,1080],[780,1060],[800,1080],[800,1130]],1.2,false,3,.9);
g.fillStyle='rgba(200,120,40,.55)';g.beginPath();g.arc(780,1095,7,0,7);g.fill();
label('大聖堂',860,1150,28,.9,600,'left'); label('（灯火教会）',860,1182,20,.7,500,'left');
// plaza
g.strokeStyle=ink(.6);g.lineWidth=2;g.setLineDash([6,6]);g.beginPath();g.ellipse(790,1290,95,55,0,0,7);g.stroke();g.setLineDash([]);
label('中央広場',790,1290,26,.85,600);
// watch post
wob([[960,1265],[1050,1265],[1050,1315],[960,1315]],1.5,true,3,.9); label('治安維持隊詰所',1005,1345,22,.85,600);
// streets
wob([[800,690],[800,760],[810,1060],[790,1235]],2,false,3,.45); wob([[790,1345],[800,1420],[880,1470],[920,1560],[1050,1720],[1150,1900]],2,false,3,.45);
wob([[700,1300],[560,1420],[520,1560]],2,false,3,.4); wob([[880,1290],[960,1290]],1.5,false,2,.4);
// lower town houses
for(let i=0;i<46;i++){const x=420+R()*860,y=1360+R()*300; const inValley=(x>590&&x<1000&&y>1600); if(inValley||Math.hypot(x-905,y-1500)<60||Math.hypot(x-600,y-1520)<55)continue; if(y>1650&&x<590&&x>420){} house(x,y,.62+R()*.2);}
label('下町',1180,1420,40,.9,700); label('（酒場・賭場・宿）',1180,1462,22,.7,500);
// Rusty Nail tavern (highlight)
g.fillStyle='rgba(180,90,40,.22)';g.beginPath();g.arc(905,1495,58,0,7);g.fill();
wob([[870,1475],[940,1475],[940,1520],[870,1520]],1.3,true,3.5,.95); wob([[870,1475],[905,1450],[940,1475]],1.3,false,3.5,.95);
for(const a of [-.6,0,.6]){g.save();g.translate(960,1458);g.rotate(a);wob([[0,-14],[0,14]],.4,false,2.5,.95);g.restore();}
label('錆び釘亭',905,1565,32,1,800); label('（冒険者組合）',905,1600,20,.8,500);
// Black Cat
house(600,1520,1.1); label('黒猫の尾（賭場）',600,1565,22,.85,600);
// valley
const valley=[[620,1640],[980,1640],[1000,1780],[930,2040],[680,2040],[600,1820]];
g.fillStyle='rgba(120,90,50,.16)';g.beginPath();valley.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill();
for(let i=0;i<220;i++){const t=R(),p=(R()*valley.length)|0,[x0,y0]=valley[p],[x1,y1]=valley[(p+1)%valley.length];const x=x0+(x1-x0)*t,y=y0+(y1-y0)*t,dx=(800-x)*.08,dy=(1850-y)*.08;wob([[x,y],[x+dx,y+dy]],.5,false,1.4,.35);}
for(let i=0;i<26;i++){const x=650+R()*300,y=1700+R()*300;if(Math.abs(x-800)<26)continue;house(x,y,.5);}
// stairs
const st=[[760,1625],[790,1645],[755,1665],[790,1685],[755,1705]]; wob(st,1,false,3,.85); for(const [x,y] of st){wob([[x-8,y],[x+8,y]],.4,false,1.5,.7);}
label('石段',700,1665,20,.8,600,'right');
// stream from valley head to water gate
const stream=[[800,1715],[790,1790],[815,1870],[795,1950],[805,2060],[815,2140],[790,2240],[820,2330]];
g.strokeStyle='rgba(60,90,120,.55)';g.lineWidth=7;g.beginPath();stream.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();
wob(stream,1.5,false,2,.6);
g.fillStyle='rgba(239,225,191,.75)';g.beginPath();g.ellipse(800,1940,46,26,0,0,7);g.fill();wob([[756,1940],[800,1915],[844,1940],[800,1965]],1,true,2,.6);
label('下の谷',1000,1730,38,.9,700,'left'); label('（亜人の街）',1000,1770,20,.7,500,'left');
label('谷の広場',870,1985,20,.8,500,'left'); label('底の水路',735,1820,20,.75,500,'right');
// water gate
for(let k=0;k<5;k++)wob([[786+k*7,2045],[786+k*7,2075]],.3,false,2,.9); label('水門',860,2095,22,.85,600,'left');
// south gate
tower(1135,1905,1.1);tower(1185,1955,1.1); label('南門（交易の門）',1270,1900,30,.95,700,'left');
const sroad=[[1160,1930],[1220,2040],[1260,2160],[1330,2280],[1360,2340]]; wob(sroad,3,false,4,.8); wob(sroad.map(([x,y])=>[x+22,y]),3,false,2,.55);
label('南街道',1320,2140,34,.85,700,'left'); label('↓ 南の川港ネーベルへ（三日）',1300,2300,24,.75,500,'right');
// compass rose
(function(){const x=250,y=330;g.strokeStyle=ink(.85);g.lineWidth=2;g.beginPath();g.arc(x,y,70,0,7);g.stroke();g.beginPath();g.arc(x,y,58,0,7);g.stroke();
  for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,L=i%2?50:95;g.fillStyle=i%2?ink(.4):(i==0?'rgba(140,40,30,.85)':ink(.8));
    g.beginPath();g.moveTo(x+Math.cos(a)*L,y+Math.sin(a)*L);g.lineTo(x+Math.cos(a+.25)*14,y+Math.sin(a+.25)*14);g.lineTo(x,y);g.lineTo(x+Math.cos(a-.25)*14,y+Math.sin(a-.25)*14);g.closePath();g.fill();}
  label('北',x,y-118,32,.95,700);})();
// cartouche
(function(){const x=110,y=2120,w=560,h=170;g.fillStyle='rgba(239,225,191,.82)';g.fillRect(x,y,w,h);wob([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],1.5,true,3,.85);wob([[x+10,y+10],[x+w-10,y+10],[x+w-10,y+h-10],[x+10,y+h-10]],1,true,1.4,.6);
  label('城塞都市グラウヴァル',x+w/2,y+58,46,1,800); label('灰壁暦三一三年',x+w/2,y+108,24,.8,500);
  label('錆び釘亭からロズモンド館まで、早足で四半刻',x+w/2,y+142,19,.75,500);})();
document.title='done';
</script></body></html>
