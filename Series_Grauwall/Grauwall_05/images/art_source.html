<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#000}
  #stage{position:relative;width:1600px;height:2560px;overflow:hidden}
  canvas{position:absolute;inset:0}
  .title{position:absolute;right:230px;top:280px;writing-mode:vertical-rl;
    font-family:"Noto Serif CJK JP",serif;font-weight:600;font-size:150px;letter-spacing:.16em}
  .team{position:absolute;left:120px;bottom:150px;
    font-family:"Noto Serif CJK JP",serif;font-weight:600;font-size:42px;letter-spacing:.08em}
  .series{position:absolute;right:120px;top:300px;writing-mode:vertical-rl;
    font-family:"Noto Serif CJK JP",serif;font-weight:500;font-size:34px;letter-spacing:.5em}
  /* 昼（白地）は墨の文字、夜・夕は生成りの文字 */
  .day .title{color:#1f262c;text-shadow:0 0 18px rgba(255,255,255,.7)}
  .day .team,.day .series{color:rgba(31,38,44,.72)}
  .night .title{color:#F2EBDD;text-shadow:0 0 22px rgba(255,214,160,.28),0 0 2px rgba(255,255,255,.55)}
  .night .team,.night .series{color:rgba(232,220,196,.8)}
</style></head>
<body>
<div id="stage"><canvas id="c" width="1600" height="2560"></canvas>
  <div class="title">隊長の非番</div>
  <div class="series">グラウヴァル　五</div>
  <div class="team">チームジョバンニ</div>
</div>
<script>
// 第5回『隊長の非番』の表紙（仮）。#a 隊の紋 / #b 留め金 / #c 後ろ姿
// 描かないもの：顔、頬の傷、卵の瓶、短剣、赤い石
const MODE = location.hash.slice(1) || "a";
const W = 1600, H = 2560;
let g = document.getElementById("c").getContext("2d");
// ぼかしは縮小キャンバスに描いて拡大する（canvas の filter blur を何百回も使うと重い）
function soft(fn, k = 6, blur = 5){
  const main = g, oc = document.createElement("canvas"); oc.width = W/k; oc.height = H/k;
  const tmp = document.createElement("canvas"); tmp.width = W/k; tmp.height = H/k;
  g = tmp.getContext("2d"); g.scale(1/k, 1/k); fn(); g = main;
  const oc2 = oc.getContext("2d"); oc2.filter = `blur(${blur}px)`; oc2.drawImage(tmp, 0, 0);
  g.save(); g.imageSmoothingQuality = "high"; g.drawImage(oc, 0, 0, W, H); g.restore();
}
let seed = {a: 3130201, b: 3130214, c: 3130228}[MODE] || 1;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
document.getElementById("stage").className = "night";

function grad(stops, y0 = 0, y1 = H, x0 = 0, x1 = 0){
  const lg = g.createLinearGradient(x0, y0, x1, y1);
  stops.forEach(([t, c]) => lg.addColorStop(t, c)); return lg;
}
function glow(x, y, r, col, a0 = 1){
  const rg = g.createRadialGradient(x, y, 0, x, y, r);
  rg.addColorStop(0, col.replace("A", a0)); rg.addColorStop(1, col.replace("A", 0));
  g.fillStyle = rg; g.fillRect(x - r, y - r, 2*r, 2*r);
}
function snowfall(n, col, aMax, x0 = 0, y0 = 0, w = W, h = H, rMax = 5){
  for (let i = 0; i < n; i++){
    const x = x0 + rnd()*w, y = y0 + rnd()*h, r = Math.pow(rnd(), 2)*rMax + 1, a = .15 + rnd()*aMax;
    const rg = g.createRadialGradient(x, y, 0, x, y, r*2.2);
    rg.addColorStop(0, `rgba(${col},${a})`); rg.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r*2.2, 0, 7); g.fill();
  }
}
function vignette(a, cx = W/2, cy = H*.5){
  const rg = g.createRadialGradient(cx, cy, H*.25, cx, cy + H*.05, H*.8);
  rg.addColorStop(0, "rgba(0,0,0,0)"); rg.addColorStop(1, `rgba(0,0,0,${a})`);
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
}
// 画面全体にうすい粒子（絵の具の目）
function filmGrain(n, a){
  for (let i = 0; i < n; i++){ g.fillStyle = `rgba(${rnd() < .5 ? "0,0,0" : "255,240,220"},${rnd()*a})`; g.fillRect(rnd()*W, rnd()*H, 1 + rnd()*2, 1 + rnd()*2); }
}
// 三次ベジェ
function bez(P, t){ const u = 1 - t; return [0, 1].map(k => u*u*u*P[0][k] + 3*u*u*t*P[1][k] + 3*u*t*t*P[2][k] + t*t*t*P[3][k]); }
function bezD(P, t){ const u = 1 - t; return [0, 1].map(k => 3*u*u*(P[1][k] - P[0][k]) + 6*u*t*(P[2][k] - P[1][k]) + 3*t*t*(P[3][k] - P[2][k])); }
// 中心線 P に沿った帯（耳の形など）
function ribbon(P, wfn, n = 70){
  const L = [], R = [];
  for (let i = 0; i <= n; i++){
    const t = i/n, [x, y] = bez(P, t), [dx, dy] = bezD(P, t), l = Math.hypot(dx, dy) || 1, nx = -dy/l, ny = dx/l, w = wfn(t);
    L.push([x + nx*w, y + ny*w]); R.push([x - nx*w, y - ny*w]);
  }
  g.beginPath(); L.forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); R.reverse().forEach(p => g.lineTo(...p)); g.closePath();
}
const earW = (wm, b = .5) => t => wm*(b + (1 - b)*Math.sin(Math.PI/2*Math.min(t/.45, 1)))*(t > .62 ? Math.sqrt(Math.max(0, 1 - Math.pow((t - .62)/.38, 2))) : 1);
// 木目の板（横方向の板、奥 y0 から手前 y1 へ遠近）
function planks(y0, y1, x0, x1, base, dark, light, nSeam, nGrain){
  g.fillStyle = base; g.fillRect(x0, y0, x1 - x0, y1 - y0);
  for (let k = 1; k < nSeam; k++){
    const y = y0 + (y1 - y0)*Math.pow(k/nSeam, 1.5), p = (y - y0)/(y1 - y0);
    g.fillStyle = `rgba(${dark},.55)`; g.fillRect(x0, y - 1 - p*2, x1 - x0, 2 + p*4);
    g.fillStyle = `rgba(${light},.10)`; g.fillRect(x0, y + 2 + p*3, x1 - x0, 1 + p*2);
  }
  g.lineCap = "round";
  for (let i = 0; i < nGrain; i++){
    const y = y0 + (y1 - y0)*Math.pow(rnd(), 1.3), p = (y - y0)/(y1 - y0), xs = x0 + rnd()*(x1 - x0), L = 200 + rnd()*900;
    g.strokeStyle = `rgba(${rnd() < .6 ? dark : light},${.04 + rnd()*.10})`; g.lineWidth = .6 + p*3*rnd();
    g.beginPath(); const ph = rnd()*7, amp = (1 + p*4)*rnd();
    for (let s = 0; s <= 20; s++){ const x = xs - L/2 + L*s/20, yy = y + Math.sin(s*.7 + ph)*amp; s ? g.lineTo(x, yy) : g.moveTo(x, yy); }
    g.stroke();
  }
}
// 湯気
function steam(x0, y0, h, col, n = 6, spread = 60){
  g.save(); g.lineCap = "round";
  for (let k = 0; k < n; k++){
    const sg = g.createLinearGradient(0, y0, 0, y0 - h);
    sg.addColorStop(0, `rgba(${col},0)`); sg.addColorStop(.12, `rgba(${col},${.20 - k*.015})`); sg.addColorStop(1, `rgba(${col},0)`);
    g.strokeStyle = sg; g.lineWidth = 10 + k*9; g.filter = `blur(${6 + k*4}px)`;
    const ph = rnd()*7, dx = (k - n/2)*spread/n, drift = (rnd() - .3)*120, hh = h*(.6 + rnd()*.4);
    g.beginPath();
    for (let s = 0; s <= 40; s++){ const t = s/40, y = y0 - t*hh, x = x0 + dx*(1 - t*.4) + Math.sin(t*7 + ph)*50*t + drift*t*t; s ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke();
  }
  g.restore();
}

// ── 案A 隊の紋 ─────────────────────
// 治安維持隊の紋：灰色の城壁の胸壁の上に、短い槍と棍棒を交差させた鉄の打ち出し。詰所の扉の鉄板。雪解けの水滴。
function hammered(x0, y0, w, h, n, s = 1){
  g.save();
  for (let i = 0; i < n; i++){ const x = x0 + rnd()*w, y = y0 + rnd()*h, r = (6 + rnd()*14)*s;
    g.fillStyle = `rgba(0,0,0,${.05 + rnd()*.07})`; g.beginPath(); g.ellipse(x + r*.3, y + r*.35, r, r*.8, 0, 0, 7); g.fill();
    g.fillStyle = `rgba(200,210,220,${.03 + rnd()*.05})`; g.beginPath(); g.ellipse(x - r*.3, y - r*.35, r*.7, r*.5, 0, 0, 7); g.fill(); }
  g.restore();
}
// 浮き出し：影→光→本体の順で重ねる
function relief(path, base, lightA = .45, shadowA = .7, d = 7){
  g.save(); g.filter = "blur(4px)"; g.fillStyle = `rgba(0,0,0,${shadowA})`; g.translate(d*.9, d*1.2); path(); g.fill(); g.restore();
  g.save(); g.fillStyle = `rgba(215,225,235,${lightA})`; g.translate(-d*.35, -d*.45); path(); g.fill(); g.restore();
  g.fillStyle = base; path(); g.fill();
}
function rivet(x, y, r){
  g.fillStyle = "rgba(0,0,0,.55)"; g.beginPath(); g.arc(x + r*.4, y + r*.5, r*1.1, 0, 7); g.fill();
  const rg = g.createRadialGradient(x - r*.35, y - r*.4, 1, x, y, r); rg.addColorStop(0, "#9aa2aa"); rg.addColorStop(.5, "#4b5056"); rg.addColorStop(1, "#1d2024");
  g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
}
function drop(x, y, r, tail = 0){
  if (tail){ const sg = g.createLinearGradient(0, y - tail, 0, y); sg.addColorStop(0, "rgba(10,14,20,0)"); sg.addColorStop(1, "rgba(10,14,20,.35)");
    g.save(); g.filter = "blur(2px)"; g.fillStyle = sg; g.fillRect(x - r*.6, y - tail, r*1.2, tail);
    const hg = g.createLinearGradient(0, y - tail, 0, y); hg.addColorStop(0, "rgba(220,230,240,0)"); hg.addColorStop(1, "rgba(220,230,240,.12)");
    g.fillStyle = hg; g.fillRect(x - r*.4, y - tail, r*.3, tail); g.restore(); }
  g.fillStyle = "rgba(0,0,0,.45)"; g.beginPath(); g.ellipse(x + r*.25, y + r*.35, r, r*1.15, 0, 0, 7); g.fill();
  const rg = g.createRadialGradient(x, y + r*.3, 0, x, y, r*1.1); rg.addColorStop(0, "rgba(190,200,215,.5)"); rg.addColorStop(.6, "rgba(80,90,104,.35)"); rg.addColorStop(1, "rgba(20,24,30,.6)");
  g.fillStyle = rg; g.beginPath(); g.moveTo(x, y - r*1.4); g.bezierCurveTo(x + r*.9, y - r*.4, x + r, y + r, x, y + r); g.bezierCurveTo(x - r, y + r, x - r*.9, y - r*.4, x, y - r*1.4); g.fill();
  g.fillStyle = "rgba(255,250,240,.9)"; g.beginPath(); g.ellipse(x - r*.35, y - r*.1, r*.22, r*.3, -.3, 0, 7); g.fill();
}
function drawA(){
  // 詰所の扉：灰色にくすんだ縦板
  g.fillStyle = "#1f2226"; g.fillRect(0, 0, W, H);
  for (let x = -40, k = 0; x < W; x += 230, k++){
    const pg = g.createLinearGradient(x, 0, x + 230, 0); const t = 52 + (rnd()*14|0);
    pg.addColorStop(0, `rgb(${t - 8},${t - 4},${t})`); pg.addColorStop(.5, `rgb(${t + 6},${t + 8},${t + 10})`); pg.addColorStop(1, `rgb(${t - 12},${t - 10},${t - 6})`);
    g.fillStyle = pg; g.fillRect(x + 4, 0, 222, H);
    g.fillStyle = "rgba(0,0,0,.75)"; g.fillRect(x, 0, 6, H);
    for (let i = 0; i < 70; i++){ g.strokeStyle = `rgba(${rnd() < .6 ? "10,12,14" : "150,155,160"},${.05 + rnd()*.10})`; g.lineWidth = 1 + rnd()*2.5; const xx = x + 12 + rnd()*206;
      g.beginPath(); g.moveTo(xx, 0); g.bezierCurveTo(xx + (rnd() - .5)*24, H*.3, xx + (rnd() - .5)*24, H*.7, xx + (rnd() - .5)*10, H); g.stroke(); }
  }
  // 濡れ（上から筋になって流れる）
  for (let i = 0; i < 40; i++){ const x = rnd()*W, y0 = rnd()*H*.5, L = 300 + rnd()*1200, w = 8 + rnd()*30;
    const sg = g.createLinearGradient(0, y0, 0, y0 + L); sg.addColorStop(0, "rgba(5,8,12,0)"); sg.addColorStop(.3, `rgba(5,8,12,${.10 + rnd()*.12})`); sg.addColorStop(1, "rgba(5,8,12,0)");
    g.fillStyle = sg; g.fillRect(x, y0, w, L); }
  // 鉄の帯（上下）
  for (const y of [H*.06, H*.79]){
    g.save(); g.filter = "blur(8px)"; g.fillStyle = "rgba(0,0,0,.6)"; g.fillRect(0, y + 10, W, 120); g.restore();
    const bg = g.createLinearGradient(0, y, 0, y + 110); bg.addColorStop(0, "#5b6066"); bg.addColorStop(.15, "#3a3e44"); bg.addColorStop(1, "#1c1e22");
    g.fillStyle = bg; g.fillRect(0, y, W, 110);
    soft(() => hammered(0, y, W, 110, 120, .6), 2, 2);
    g.save(); g.filter = "blur(6px)"; for (let i = 0; i < 14; i++){ const x = rnd()*W; const sg = g.createLinearGradient(0, y, 0, y + 200); sg.addColorStop(0, `rgba(140,66,30,${.2 + rnd()*.2})`); sg.addColorStop(1, "rgba(140,66,30,0)"); g.fillStyle = sg; g.fillRect(x, y + 20, 8 + rnd()*26, 160 + rnd()*120); } g.restore();
    for (let x = 80; x < W; x += 200) rivet(x, y + 55, 13);
  }
  // 上の帯に残った雪（溶けかけ）
  soft(() => { g.fillStyle = "rgba(220,226,232,.95)"; for (let i = 0; i < 26; i++){ const x = rnd()*W; g.beginPath(); g.ellipse(x, H*.06 - 4, 40 + rnd()*120, 10 + rnd()*18, 0, Math.PI, 0); g.fill(); } }, 3, 2);
  // 戸口のランタンの温かい光（左上の外から）と、雪解けの冷たい空の光
  glow(-100, H*.20, 1500, "rgba(255,170,90,A)", .28);
  glow(W*.45, H*.55, 1100, "rgba(150,170,195,A)", .15);

  // 紋章の鉄板（盾形）
  const cx = W*.42, top = H*.30, sw = 820, sh = 1020;
  const shield = (inset = 0) => () => { const w = sw/2 - inset, t = top + inset, b = top + sh - inset*1.3;
    g.beginPath(); g.moveTo(cx - w, t); g.quadraticCurveTo(cx, t + 40, cx + w, t); g.lineTo(cx + w, t + (b - t)*.45);
    g.quadraticCurveTo(cx + w, t + (b - t)*.82, cx, b); g.quadraticCurveTo(cx - w, t + (b - t)*.82, cx - w, t + (b - t)*.45); g.closePath(); };
  g.save(); g.filter = "blur(26px)"; g.fillStyle = "rgba(0,0,0,.75)"; g.translate(26, 40); shield()(); g.fill(); g.restore();
  const pg = g.createLinearGradient(cx - sw/2, top, cx + sw/2, top + sh); pg.addColorStop(0, "#5d636a"); pg.addColorStop(.5, "#3c4147"); pg.addColorStop(1, "#22252a");
  g.fillStyle = pg; shield()(); g.fill();
  g.save(); shield()(); g.clip();
  soft(() => hammered(cx - sw/2, top, sw, sh, 900), 2, 2);
  // 錆の流れ
  for (let i = 0; i < 18; i++){ const x = cx - sw/2 + rnd()*sw, y0 = top + rnd()*sh*.6, L = 120 + rnd()*400;
    const sg = g.createLinearGradient(0, y0, 0, y0 + L); sg.addColorStop(0, `rgba(150,72,32,${.18 + rnd()*.2})`); sg.addColorStop(1, "rgba(150,72,32,0)");
    g.fillStyle = sg; g.filter = "blur(3px)"; g.fillRect(x, y0, 6 + rnd()*20, L); }
  g.filter = "none";
  g.restore();
  // 縁の打ち返し
  g.save(); g.lineWidth = 34; g.strokeStyle = "#2a2e33"; shield(17)(); g.stroke();
  g.lineWidth = 6; g.strokeStyle = "rgba(200,212,224,.35)"; g.translate(-4, -5); shield(4)(); g.stroke(); g.restore();
  g.save(); g.lineWidth = 4; g.strokeStyle = "rgba(0,0,0,.6)"; shield(36)(); g.stroke(); g.restore();
  for (let i = 0; i < 16; i++){ const a = i/16;
    // 縁に沿った鋲
    let x, y; if (a < .25){ x = cx - sw/2 + 30 + a*4*(sw - 60); y = top + 32 + Math.sin(a*4*Math.PI)*18; }
    else { const t = (a - .25)/.75, side = t < .5 ? 1 : -1, u = t < .5 ? t*2 : (1 - t)*2; const [px, py] = bez([[cx + side*(sw/2 - 30), top + 40], [cx + side*(sw/2 - 30), top + sh*.5], [cx + side*(sw/2 - 60), top + sh*.8], [cx, top + sh - 60]], u); x = px; y = py; }
    rivet(x, y, 12); }

  const metal = "#4a5057";
  // 交差する短い槍（左下→右上）
  const spear = () => { g.save(); g.translate(cx, top + sh*.33); g.rotate(-.78);
    g.beginPath(); g.roundRect(-380, -15, 570, 30, 12); // 柄
    g.moveTo(190, -32); g.quadraticCurveTo(250, -52, 360, 0); g.quadraticCurveTo(250, 52, 190, 32); g.closePath(); // 穂（木の葉形）
    g.rect(172, -26, 22, 52); // 口金
    g.restore(); };
  // 交差する棍棒（右下→左上）
  const club = () => { g.save(); g.translate(cx, top + sh*.33); g.rotate(-2.36);
    g.beginPath(); g.moveTo(-380, -16); g.lineTo(40, -22); g.quadraticCurveTo(190, -48, 300, -42); g.quadraticCurveTo(342, 0, 300, 42); g.quadraticCurveTo(190, 48, 40, 22); g.lineTo(-380, 16); g.closePath();
    g.restore(); };
  relief(club, metal); relief(spear, metal);
  // 棍棒の鉄輪・槍の刃の稜線
  g.save(); g.translate(cx, top + sh*.33); g.rotate(-2.36);
  for (const x of [110, 190, 262]){ g.fillStyle = "#2a2e33"; g.fillRect(x, -46, 14, 92); g.fillStyle = "rgba(210,220,230,.35)"; g.fillRect(x - 3, -46, 3, 92); }
  g.restore();
  g.save(); g.translate(cx, top + sh*.33); g.rotate(-.78);
  g.strokeStyle = "rgba(220,230,240,.45)"; g.lineWidth = 3; g.beginPath(); g.moveTo(200, 0); g.lineTo(350, 0); g.stroke();
  g.strokeStyle = "rgba(0,0,0,.4)"; g.beginPath(); g.moveTo(200, 4); g.lineTo(348, 3); g.stroke();
  g.restore();
  // 灰色の城壁と胸壁（槍と棍棒の前）
  const wl = cx - 300, wr = cx + 300, wt = top + sh*.50, wb = top + sh*.76, mw = 92, mh = 80;
  const wall = () => { g.beginPath(); g.moveTo(wl, wb); g.lineTo(wl, wt);
    const n = 4, gap = (wr - wl - n*mw)/(n - 1);
    for (let i = 0; i < n; i++){ const x = wl + i*(mw + gap); g.lineTo(x, wt - mh); g.lineTo(x + mw, wt - mh); g.lineTo(x + mw, wt); if (i < n - 1) g.lineTo(x + mw + gap, wt); }
    g.lineTo(wr, wb); g.closePath(); };
  relief(wall, "#5a6067", .5, .8, 9);
  g.save(); wall(); g.clip();
  soft(() => hammered(wl, wt - mh, wr - wl, wb - wt + mh, 160, .7), 2, 2);
  // 石積みの刻み
  g.strokeStyle = "rgba(10,12,16,.65)"; g.lineWidth = 4;
  for (let r = 0; r < 5; r++){ const y = wt + 10 + r*((wb - wt)/5); g.beginPath(); g.moveTo(wl, y); g.lineTo(wr, y); g.stroke();
    for (let x = wl + (r % 2)*50; x < wr; x += 100){ g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + (wb - wt)/5); g.stroke(); } }
  g.strokeStyle = "rgba(210,220,230,.18)"; g.lineWidth = 2;
  for (let r = 0; r < 5; r++){ const y = wt + 14 + r*((wb - wt)/5); g.beginPath(); g.moveTo(wl, y); g.lineTo(wr, y); g.stroke(); }
  g.restore();
  // 門（中央の小さなアーチ）
  g.fillStyle = "#15181c"; g.beginPath(); g.moveTo(cx - 52, wb); g.lineTo(cx - 52, wb - 90); g.arc(cx, wb - 90, 52, Math.PI, 0); g.lineTo(cx + 52, wb); g.closePath(); g.fill();
  g.strokeStyle = "rgba(210,220,230,.3)"; g.lineWidth = 3; g.beginPath(); g.arc(cx, wb - 90, 56, Math.PI*1.05, Math.PI*1.6); g.stroke();
  // 雪解けの水滴：上縁に溜まり、筋になって落ちる
  for (let i = 0; i < 8; i++){ const x = cx - sw/2 + 50 + rnd()*(sw - 100), y = top + 60 + rnd()*sh*.7, r = 6 + rnd()*9; drop(x, y, r, rnd() < .6 ? 60 + rnd()*200 : 0); }
  for (let i = 0; i < 4; i++){ const x = wl + 20 + rnd()*(wr - wl - 40); drop(x, wt - mh + 8 + rnd()*10, 7 + rnd()*5, 0); }
  // 盾の先から垂れる滴
  drop(cx, top + sh + 36, 15, 0); drop(cx + 4, top + sh + 170, 9, 40);

      g.strokeStyle = "rgba(255,200,140,.30)"; g.lineWidth = 3; g.beginPath(); g.moveTo(-118, -1106); g.quadraticCurveTo(0, -1148, 118, -1106); g.stroke(); }
    // 頭（後ろから。黒褐色の髪を低く結う）

  // 濡れた石への映り込み（逆さ、淡く）
