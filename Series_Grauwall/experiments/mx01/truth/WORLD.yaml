# ------------------------------------------------------------
# 章ごとの設計（書き手パケットに入る）。beliefs_end は章末の視点人物の見立て
# ------------------------------------------------------------
chapters:
  1:
    title: 七つの鐘
    target_chars: 3000
    span: "D4 18:00-21:00"
    function: >-
      雨の錆び釘亭。片腕のダリオが早くから飲んでいる。リナが夕飯を断って裏へ抜け、七つの鐘にコルがマグダ隊長の
      「つけを払え」を届けに来る（駄賃を三つずつ数える）。リナが羽根と白い指で帰っていき、そのあとフーゴが
      ダリオに相談する。章末、ダリオは厄介なことを引き受けたと思う。
    beliefs_end:
      - リナは毎晩、七つの鐘のころ、コルと厩の二階に上がっているらしい（フーゴが見た）
      - リナはフーゴに嘘をついた、とフーゴは言う。組合の中で組合員が嘘をつけるのは、酒か、金か、長の命のときだけ
      - 長の命ではあるまい。酒か、金か。ダリオはまだ決めかねている
    free: [雨と軒の音, ダリオの吊った腕と片手の麦酒, マスターとの軽口, マグダのつけの冗談, フーゴの若さと心配性, リナの金への執着の小さな見せ場]
  2:
    title: 酒精か、代価か
    target_chars: 3000
    span: "D5 10:00-16:30"
    function: >-
      翌朝、ダリオが不器用に調べる。リナの息に酒の匂いはない（石板の数字）。外階段で小さな羽根を拾う。
      マスターの二言三言。ザザに一つだけ訊く。酒でも金でもなさそうだが、フーゴは確かにコルを見た。
      手に負えず、二階の組合長の部屋へ持っていく。
    beliefs_end:
      - 酒ではない。朝の息に酒の匂いはなかった
      - 店でリナに銭を払う者もいない。代価でもなさそうだ
      - それでも、フーゴは確かにリナとコルを見た。ザザも鴉人が上がっていくと言った
      - 自分では分からない。組合長に持っていく
    free: [片腕で外階段を上がる滑稽さ, ザザの掃除と短い答え, リナの杖と石板, 雨上がりの中庭]
  3:
    title: 群れの数え方
    target_chars: 3500
    span: "D5 15:00-19:45"
    function: >-
      解決。エーリカがダリオの話を聞き、二つ三つ訊き返して、七つの鐘に中庭へ出る。鴉人は二人いる。
      コルに一つだけ訊き、厩の二階に上がる。リナはキリに十ずつの勘定を教えていた。
    free: [エーリカの決断の前の一呼吸, リナの照れ隠しと金勘定, キリの三ずつの癖, フーゴがパン代を払わされる結び]

# ------------------------------------------------------------
# 解答キー（第3章でエーリカが示す推理。fairness 判定にも使う）
# refs は視点人物（ダリオ）が受け取った知覚・言明の id。chapter はそれが出る章
# ------------------------------------------------------------
solution:
  answer:
    who: 厩の二階でリナと会っているのはコルではなく、コルの妹キリ（鴉人・十二・未登録）
    how: 人間には鴉人の個体が見分けられない。同じ七つの鐘に、コルはカウンターでダリオに伝言を届けていた
    lie: リナは嘘をついていない。『コル「とは」何もしていない』は字義どおり本当
    why_light: >-
      キリは兄のような伝令になりたい。伝令は人間の釣り銭を十ずつ勘定できないと務まらない（鴉人は三ずつ数える）。
      組合でいちばん勘定の速いリナが、煮込み代でキリの夕飯のパンを買って、毎晩教えていた。
      未登録の子を夜に厩へ上げていること、金に目がないリナが只で教えていることを、知られたくなかった。
  clues:
    - {id: K1, text: 七つの鐘のころ、コルはカウンターでダリオに伝言を届けていた, refs: [P_d411], chapter: 1}
    - {id: K2, text: フーゴは同じ七つの鐘に、リナと鴉人が外階段を上がるのを見た, refs: [S09], chapter: 1}
    - {id: K3, text: リナの答えは『コル「とは」何もしてない』。嘘をつけない者のはぐらかし, refs: [S07], chapter: 1}
    - {id: K4, text: 鴉人は三つずつ数える, refs: [S04, P_d411], chapter: 1}
    - {id: K5, text: 石板の『三、六、九、十二』を消して『十』, refs: [P_d501], chapter: 2}
    - {id: K6, text: 外階段の羽根はコルのより小ぶりで、縁が灰色, refs: [P_d502, S13], chapter: 2}
    - {id: K7, text: ザザは『小さい足の、鴉人』と言った, refs: [S16], chapter: 2}
    - {id: K8, text: リナは外からパンを持ち込み、鴉人が紙の包みを抱えて裏木戸から出た, refs: [P_d403, S10, S14], chapter: 2}
  misreadings:   # 読者に起こしたい誤読（章末）
    1: リナはコルと会っていて、フーゴに嘘をついた。酒精か代価のどちらか（銭を渡しているので代価か）
    2: 酒精ではない。代価も見えない。それでもコルと会っている――なぜ嘘がつけたのか分からない（確信できない状態）
  fairness:
    must_not_solve_after: 1     # 第1章の後で「鴉人は二人」と確信されたら失格（早すぎる看破）
    solvable_after: 2           # 第2章の後には、手がかりから推理できること
