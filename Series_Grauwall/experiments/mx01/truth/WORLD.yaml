# ============================================================
# mx01 — 真相台帳（World Log）
# 【作者のみ】このファイルは書き手（第1・2章）にも読者役にも渡さない。
#   書き手に渡すのは tools/mx.py project が作る投影パケットだけ。
# ============================================================

meta:
  id: mx01
  title: 七つの鐘の鴉（仮題）
  series: グラウヴァル（番外・実験。正典に入れない）
  period: 灰壁暦三一三年 水無月十日〜十四日（梅雨）
  genre: 日常の謎（フーダニット＋ハウダニット。ホワイは軽く）
  viewpoint: dario
  narration: 三人称一元（ダリオの目と耳だけ）・過去形
  solution_chapter: 3
  max_blind_spots: 1
  days: {D1: 水無月十日, D2: 水無月十一日, D3: 水無月十二日, D4: 水無月十三日, D5: 水無月十四日}
  # 書き手パケットに一語でも出たら止める語（真相側にしかない語）
  leak_tokens: [キリ, kiri, 妹, BS1, 死角, 真相, もう一人の鴉人, 別の鴉人, 二人の鴉人, 未登録, 見習い]

# ------------------------------------------------------------
# 場所。interior: 組合の建物の中（鉄の誓約が効く）
# ------------------------------------------------------------
places:
  counter:     {name: 錆び釘亭の酒場, interior: true}
  erika_room:  {name: 二階の組合長の部屋, interior: true}
  courtyard:   {name: 中庭（裏口の軒下・井戸）, interior: false}
  loft_stairs: {name: 厩の外階段, interior: false}
  loft:        {name: 厩の二階, interior: false}
  alley:       {name: 裏木戸の外の路地, interior: false}
  bakery:      {name: 下町のパン屋, interior: false}
  tsumesho:    {name: 治安維持隊詰所, interior: false}
  valley:      {name: 下の谷, interior: false}
  lodging:     {name: リナの下宿, interior: false}

edges:   # 徒歩の分数
  - [counter, courtyard, 1]
  - [courtyard, loft_stairs, 0]   # 外階段の上り下りは、階段の出来事（loft_stairs）の時間の中に含める
  - [loft_stairs, loft, 0]
  - [courtyard, alley, 1]
  - [counter, erika_room, 1]
  - [counter, bakery, 8]
  - [counter, tsumesho, 10]
  - [alley, valley, 14]
  - [counter, lodging, 10]

visibility:   # その場所から見える別の場所
  courtyard: [loft_stairs]
  loft_stairs: [courtyard]

# ------------------------------------------------------------
# 人物。hidden: 視点人物が最後まで（解決章まで）存在を知らない
# assumes: 見分けられない種族を見たとき、誰だと思うか
# knows:   見分けられなくても、名乗られて知っている相手
# ------------------------------------------------------------
entities:
  dario:  {name: ダリオ, kind: human, member: true, distinguishes: false, assumes: {鴉人: kol, 蜥蜴人: zaza},
           attrs: {desc: 剣士・大男・酒好き・髭の端が縮れている, arm: 左腕を吊っている（皐月に折った）}}
  hugo:   {name: フーゴ, kind: human, member: true, distinguishes: false, assumes: {鴉人: kol, 蜥蜴人: zaza},
           attrs: {desc: 人間の若い剣士・登録二年・まっすぐで心配性。リナの友人}}
  rina:   {name: リナ, kind: human, member: true, distinguishes: false, knows: [kiri],
           attrs: {desc: 人間・十六・魔法使い・麦藁色の髪・父のお下がりの杖・金に目がない・勘定が組合でいちばん速い}}
  erika:  {name: エーリカ, kind: human, member: false, oath_master: true, distinguishes: true,
           attrs: {desc: 組合長・元弓使い・狩人の目・亜人を見分ける・嘘が下手}}
  master: {name: マスター, kind: human, member: false, distinguishes: true,
           attrs: {desc: 錆び釘亭の酒場番。丁寧語}}
  zaza:   {name: ザザ, kind: 蜥蜴人, member: false, demihuman: true, distinguishes: true,
           attrs: {desc: 掃除番・老人・熱が見える・人を足で覚えて呼ぶ・訊かれたことだけ答える}}
  kol:    {name: コル, kind: 鴉人, member: false, demihuman: true, distinguishes: true, role: 伝令,
           attrs: {desc: 組合の伝令（雑役）の若者・厩の梁で寝る・伝言を一字も盛らない, counts_by: 3, feather: 大きく真っ黒, feet: 大人の鴉人の足}}
  kiri:   {name: キリ, kind: 鴉人, member: false, demihuman: true, distinguishes: true, hidden: true,
           attrs: {desc: 鴉人の娘・十二・下の谷から通う, relation: コルの妹, registered: false,
                   counts_by: 3, feather: 小ぶりで縁が灰色（若い鴉人）, feet: 小さい足,
                   wish: 兄のような伝令になりたい。伝令は人間の釣り銭を十ずつ勘定できないと務まらない}}
  magda:  {name: マグダ隊長, kind: human, member: false, distinguishes: false, offscreen: true,
           attrs: {desc: 治安維持隊長}}

objects:
  feather1: {owner: kiri, attrs: {size: small, edge: grey}, desc: 外階段の三段目に落ちていた小さな黒い羽根}

# ------------------------------------------------------------
# 死角（この作品は一つだけ）
# ------------------------------------------------------------
blind_spots:
  - id: BS1
    axis: 認識
    mask: who
    target: kiri
    perceived_as: kol
    applies_to: [hugo, dario]
    description: >-
      人間の多くは鴉人の個体を見分けない。組合の敷地で鴉人を見れば、組合にいるただ一人の鴉人、伝令のコルだと思う。
      コルとキリは兄妹で、雨の夕方の軒下からは大きさの違いも分かりにくい。

